<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VybezHub JA - Jamaica's Youth Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->

    <script>
        tailwind.config = {
            theme: {

                            yellow: '#FCD116',

<body class="flex justify-center items-center min-h-screen bg-black sm:py-6">

    <!-- Mobile Screen Frame Container -->
    <div class="w-full max-w-md bg-brand-dark min-h-screen sm:min-h-[844px] sm:max-h-[844px] sm:rounded-[40px] border-0 sm:border-8 border-neutral-800 shadow-2xl overflow-hidden flex flex-col relative">

        <!-- Header -->
        <header class="bg-brand-dark/95 backdrop-blur-md px-4 py-3 border-b border-neutral-800 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-yellow via-brand-green to-emerald-400 flex items-center justify-center font-black text-black text-lg shadow-lg">
                    ⚡
                </div>
                <span class="font-black text-xl tracking-tight text-white">Vybez<span class="text-brand-yellow">Hub</span> <span class="text-xs bg-brand-green text-black px-1.5 py-0.5 rounded font-bold uppercase tracking-wide">JA</span></span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchTab('soundboard')" class="bg-neutral-800 hover:bg-neutral-700 p-2 rounded-full text-brand-yellow transition">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
                <div class="relative">
                    <i data-lucide="bell" class="w-6 h-6 text-neutral-400"></i>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand-accent rounded-full animate-ping"></span>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand-accent rounded-full"></span>
                </div>
            </div>
        </header>

        <!-- Main Dynamic Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto hide-scrollbar pb-20">
            <!-- Content dynamically rendered via JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-brand-dark/95 backdrop-blur-lg border-t border-neutral-800 py-2.5 px-6 flex justify-between items-center z-30">
            <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-brand-yellow">
                <i data-lucide="flame" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold">Feed</span>
            </button>
            <button onclick="switchTab('csec')" id="nav-csec" class="flex flex-col items-center gap-1 text-neutral-400">
                <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold">CSEC Quiz</span>
            </button>
            <button onclick="switchTab('soundboard')" id="nav-soundboard" class="flex flex-col items-center gap-1 text-neutral-400">
                <i data-lucide="music" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold">Sounds</span>
            </button>
            <button onclick="switchTab('hustle')" id="nav-hustle" class="flex flex-col items-center gap-1 text-neutral-400">
                <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold">Market</span>
            </button>
        </nav>
    </div>

    <!-- Audio Player Script & State Management -->
    <script>
        // State
        let activeTab = 'feed';
        let activeFilter = 'All';
        let quizScore = 0;
        let currentQuestion = 0;

        // Sample Data
        const feedPosts = [
            {
                id: 1,
                author: "KC Fortis Fanatic 🟣⚪",
                school: "Kingston College",
                parish: "Kingston",
                category: "Champs",
                content: "North Street quiet right now but wait until Champs week! 🏆 Best track squad this year hands down. Who taking 100m boys class 1?",
                likes: 412,
                comments: 89,
                time: "12m ago"
            },
            {
                id: 2,
                author: "Immaculate Vibes 💙",
                school: "Immaculate Conception",
                parish: "St. Andrew",
                category: "School Wars",
                content: "Uniform clean check! ✨ Big up all IC girls preparing for CSEC Orals this week. We got this! 💪🏽",
                likes: 298,
                comments: 34,
                time: "45m ago"
            },
            {
                id: 3,
                author: "Mobay Trendz 🌴",
                school: "Cornwall College",
                parish: "St. James",
                category: "Dance",
                content: "New dance challenge taking over Western Jamaica right now! Tag your squad who can hit this clean 🔥",
                likes: 856,
                comments: 112,
                time: "2h ago"
            }
        ];

        const quizQuestions = [
            {
                subject: "CSEC Mathematics",
                question: "Solve for x: 3x + 7 = 22",
                options: ["x = 3", "x = 5", "x = 7", "x = 4"],
                correct: 1,
                explanation: "Subtract 7 from 22 to get 15. Then divide 15 by 3 to get 5."
            },
            {
                subject: "CSEC English A",
                question: "Identify the figure of speech: 'The wind whispered through the mangroves.'",
                options: ["Metaphor", "Simile", "Personification", "Hyperbole"],
                correct: 2,
                explanation: "Giving human qualities (whispering) to non-human things (wind) is personification."
            },
            {
                subject: "Caribbean History",
                question: "In which year did Jamaica gain Independence?",
                options: ["1938", "1962", "1974", "1958"],
                correct: 1,
                explanation: "Jamaica gained independence from Britain on August 6, 1962."
            }
        ];

        const soundboardClips = [
            { title: "Pull Up Selector!", tag: "DJ Horn", icon: "disc" },
            { title: "Bomboclaat!", tag: "Slang", icon: "zap" },
            { title: "Up Top Boss 🗣️", tag: "Vibe", icon: "mic" },
            { title: "Zeen!", tag: "Classic", icon: "check-circle" },
            { title: "Gwaan Suh!", tag: "Hype", icon: "flame" },
            { title: "Champs Horn 🎺", tag: "Sports", icon: "trophy" }
        ];

        const marketItems = [
            { title: "Custom School Bag Tags", seller: "@JamaicaCrafts", price: "$1,500 JMD", tags: "Accessories" },
            { title: "CSEC Maths & Physics Tutoring", seller: "@KCGraduate24", price: "$2,000 / hr", tags: "Services" },
            { title: "Thrifted Vintage Jackets", seller: "@MobayFits", price: "$3,500 JMD", tags: "Fashion" }
        ];

        // Sound Engine (Web Audio API Synthesizer Sounds)
        function playSoundEffect(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'horn') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            }
        }

        // Render Functions
        function renderFeed() {
            return `
                <div class="p-4 space-y-4">
                    <!-- Category Chips -->
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                        ${['All', 'Champs 🏆', 'School Wars', 'Dance 💃', 'CSEC Prep'].map(cat => `
                            <button onclick="setFilter('${cat}')" class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${activeFilter === cat ? 'bg-brand-yellow text-black' : 'bg-neutral-800 text-neutral-300'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>

                    <!-- School Rivalry Banner -->
                    <div class="bg-gradient-to-r from-purple-900 to-indigo-900 rounded-2xl p-4 border border-purple-500/30 flex justify-between items-center shadow-lg">
                        <div>
                            <span class="text-[10px] uppercase tracking-widest font-bold text-purple-300">Live Clash</span>
                            <h4 class="font-extrabold text-sm">KC vs Calabar Trivia Battle</h4>
                            <p class="text-xs text-purple-200 mt-0.5">1.2k students competing right now</p>
                        </div>
                        <button onclick="switchTab('csec')" class="bg-brand-yellow text-black px-3 py-1.5 rounded-xl font-black text-xs hover:scale-105 transition">
                            JOIN
                        </button>
                    </div>

                    <!-- Posts Stream -->
                    ${feedPosts.map(post => `
                        <div class="bg-brand-card rounded-2xl p-4 border border-neutral-800/80 space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-sm flex items-center gap-1.5">
                                        ${post.author}
                                    </h4>
                                    <p class="text-[11px] text-neutral-400">${post.school} •${post.parish}</p>
                                </div>
                                <span class="text-[10px] bg-neutral-800 text-neutral-400 px-2 py-0.5 rounded-full font-semibold">${post.time}</span>
                            </div>
                            <p class="text-xs text-neutral-200 leading-relaxed">${post.content}</p>
                            <div class="flex items-center gap-4 text-xs text-neutral-400 pt-2 border-t border-neutral-800">
                                <button class="flex items-center gap-1 hover:text-brand-yellow">
                                    <i data-lucide="heart" class="w-4 h-4"></i>
                                    <span>${post.likes}</span>
                                </button>
                                <button class="flex items-center gap-1 hover:text-brand-yellow">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                    <span>${post.comments}</span>
                                </button>
                                <button class="flex items-center gap-1 hover:text-brand-yellow ml-auto">
                                    <i data-lucide="share-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCsec() {
            const q = quizQuestions[currentQuestion];
            return `
                <div class="p-4 space-y-4">
                    <div class="bg-brand-card rounded-2xl p-4 border border-neutral-800 text-center space-y-1">
                        <span class="text-xs text-brand-yellow font-bold uppercase tracking-wider">${q.subject}</span>
                        <h3 class="text-lg font-black">Daily CSEC Streak Challenge</h3>
                        <p class="text-xs text-neutral-400">Score points for your school leaderboard!</p>
                    </div>

                    <div class="bg-brand-card rounded-2xl p-5 border border-neutral-800 space-y-4">
                        <div class="flex justify-between items-center text-xs text-neutral-400 font-bold">
                            <span>Question ${currentQuestion + 1} of ${quizQuestions.length}</span>
                            <span class="text-brand-green">Score: ${quizScore} pts</span>
                        </div>
                        <h4 class="font-bold text-sm text-white">${q.question}</h4>
                        <div class="space-y-2">
                            ${q.options.map((opt, idx) => `
                                <button onclick="answerQuestion(${idx})" class="w-full text-left p-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-xs font-semibold text-neutral-200 transition border border-transparent hover:border-brand-yellow">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSoundboard() {
            return `
                <div class="p-4 space-y-4">
                    <div class="text-center space-y-1">
                        <h3 class="text-lg font-black">Dancehall & Slang Soundboard</h3>
                        <p class="text-xs text-neutral-400">Tap to play viral sound clips!</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        ${soundboardClips.map((sound, i) => `
                            <button onclick="playSoundEffect('${i % 2 === 0 ? 'horn' : 'beep'}')" class="bg-brand-card hover:bg-neutral-800 p-4 rounded-2xl border border-neutral-800 text-left flex flex-col justify-between h-28 group transition">
                                <div class="w-8 h-8 rounded-full bg-brand-yellow/10 group-hover:bg-brand-yellow text-brand-yellow group-hover:text-black flex items-center justify-center transition">
                                    <i data-lucide="${sound.icon}" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <span class="text-[10px] font-bold text-neutral-500 uppercase">${sound.tag}</span>
                                    <h4 class="font-black text-xs text
